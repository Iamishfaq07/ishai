name: Release

# Publishes a GitHub Release with the Windows installer so people can download the desktop app.
# Trigger by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or run manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release, e.g. 0.1.0"
        required: true

permissions:
  contents: write # create the release + upload assets

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # vite builds in production mode → apps/desktop/.env.production bakes in the hosted API/web URLs.
      - run: pnpm --filter @orbit/desktop build

      - name: tauri build (release exe + NSIS installer + updater signature)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Authenticode signing (fixes SmartScreen "unknown publisher"). Set the `WINDOWS_SIGN_COMMAND`
          # repo *variable* to your provider's CLI with a `%1` placeholder for the file path, e.g.
          #   azuresigntool sign -kvu <vault> -kvc <cert> -tr http://timestamp.acs.microsoft.com -td sha256 %1
          # and add that CLI + its credentials to this job (see docs/WINDOWS_RELEASE.md).
          # Unset → unsigned build (current behaviour). Tauri runs signCommand on each binary before it
          # produces the updater signature, so the order is correct within a single build.
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
          # Set the repo variable ORBIT_REQUIRE_SIGNING=true once a certificate exists: unsigned releases then fail.
          REQUIRE_SIGNING: ${{ vars.ORBIT_REQUIRE_SIGNING }}
        run: |
          if [[ "$REQUIRE_SIGNING" == "true" && -z "$WINDOWS_SIGN_COMMAND" ]]; then
            echo "::error::ORBIT_REQUIRE_SIGNING=true but WINDOWS_SIGN_COMMAND is not set; refusing an unsigned release."
            exit 1
          fi
          if [[ -n "$WINDOWS_SIGN_COMMAND" ]]; then
            CONFIG=$(jq -nc --arg v "${{ steps.ver.outputs.version }}" --arg s "$WINDOWS_SIGN_COMMAND" \
              '{version:$v, bundle:{windows:{signCommand:$s}}}')
            echo "Authenticode signing enabled."
          else
            CONFIG=$(jq -nc --arg v "${{ steps.ver.outputs.version }}" '{version:$v}')
            echo "No WINDOWS_SIGN_COMMAND set — building unsigned (SmartScreen will warn)."
          fi
          pnpm --filter @orbit/desktop tauri build --bundles nsis --config "$CONFIG"

      - name: Verify Authenticode signatures (installer, app exe, uninstaller)
        if: ${{ vars.WINDOWS_SIGN_COMMAND != '' }}
        shell: pwsh
        run: |
          $inst = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          7z x -y $inst.FullName -o"$env:RUNNER_TEMP/sigcheck" | Out-Null
          ./scripts/verify-authenticode.ps1 -Files $inst.FullName, "$env:RUNNER_TEMP/sigcheck/orbit-desktop.exe", "$env:RUNNER_TEMP/sigcheck/uninstall.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Orbit ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
