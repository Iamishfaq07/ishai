name: Release

# Publishes a GitHub Release with the Windows installer so people can download the desktop app.
# Trigger by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or run manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release, e.g. 0.1.0"
        required: true

permissions:
  contents: write # create the release + upload assets

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # vite builds in production mode → apps/desktop/.env.production bakes in the hosted API/web URLs.
      - run: pnpm --filter @orbit/desktop build

      - name: tauri build (release exe + NSIS installer + updater signature)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @orbit/desktop tauri build --bundles nsis --config "{\"version\":\"${{ steps.ver.outputs.version }}\"}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Orbit ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
