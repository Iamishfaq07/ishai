# Real-provider smoke tests (paid API calls). Manual only — never runs on push/PR.
# Needs repo secrets DEEPSEEK_API_KEY and DEEPGRAM_API_KEY.
name: Provider smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --frozen
      - name: DeepSeek + Deepgram smoke
        env:
          RUN_PROVIDER_SMOKE: "true"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: uv run pytest tests/smoke -v
