name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Build the Windows app as this version (e.g. 0.1.1) — for update testing / releases"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      ORBIT_ENV: test
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: orbit, POSTGRES_PASSWORD: orbit, POSTGRES_DB: orbit }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      - name: OCR engine (scanned PDF uploads)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy orbit_api
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Migrations on Postgres + pgvector
        env: { ORBIT_DATABASE_URL: "postgresql+asyncpg://orbit:orbit@localhost:5432/orbit" }
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
      # The tests whose point is locking and unique constraints (one support ticket per chat under a burst of
      # requests, account deletion taking the chat's Inbox copy), on Postgres as well as SQLite.
      - name: Race and lifecycle tests on Postgres
        env: { ORBIT_TEST_DATABASE_URL: "postgresql+asyncpg://orbit:orbit@localhost:5432/orbit" }
        run: >-
          uv run pytest -q tests/test_support_lifecycle.py tests/test_payment_settlement.py
          tests/test_razorpay.py tests/test_resume_revision.py tests/test_launch_security_boundaries.py
          tests/test_career_studio.py tests/test_career_depth.py tests/test_launch_readiness.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — version comes from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm --filter @orbit/web build
      - name: JS budget (docs/PERFORMANCE.md)
        run: pnpm --filter @orbit/web budget
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --project apps/api --frozen
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser autosave, mobile context and career flows
        run: pnpm test:e2e

  # Windows-first (macOS deferred). Builds a runnable orbit-desktop.exe + NSIS installer artifact.
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: apps/desktop/src-tauri }
      # tauri::generate_context! embeds frontendDist at compile time, so build the frontend first
      - run: pnpm --filter @orbit/desktop build
      - name: Release config must not allow http updates
        shell: pwsh
        run: |
          $c = Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($c.plugins.updater.dangerousInsecureTransportProtocol) { throw "dangerousInsecureTransportProtocol belongs in tauri.dev.conf.json only" }
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: tauri build (release exe + NSIS installer + updater signature)
        shell: bash
        env:
          # minisign key for updater signatures (not Authenticode code signing)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          overrides=()
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            [[ "$VERSION_OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION_OVERRIDE"; exit 1; }
            overrides+=("\"version\":\"$VERSION_OVERRIDE\"")
          fi
          # Dependabot and fork PRs don't get repo secrets: still prove the app builds, just without the
          # updater .sig (which needs the key) instead of failing the job.
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::notice::No updater signing key available; building without updater artifacts"
            overrides+=("\"bundle\":{\"createUpdaterArtifacts\":false}")
          fi
          if (( ${#overrides[@]} )); then
            config="{$(IFS=,; echo "${overrides[*]}")}"
            pnpm --filter @orbit/desktop tauri build --bundles nsis --config "$config"
          else
            pnpm --filter @orbit/desktop tauri build --bundles nsis
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orbit-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/release/orbit-desktop.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image (deploy artifact)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          push: false
          load: true
          tags: orbit-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building isn't enough: a base-image bump can produce an image whose app can't even import.
      - name: Import the app inside the image
        run: docker run --rm -e ORBIT_ENV=test orbit-api:ci python -c "import orbit_api.main"

  # SCA + SAST: known-vulnerable dependencies (Python, npm) and risky Python patterns (medium severity and up).
  # See docs/SECURITY_REVIEW.md for the full review and how to run these locally.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: pip-audit (API dependencies)
        working-directory: apps/api
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip --no-deps --requirement "$RUNNER_TEMP/requirements.txt"
      - name: bandit (API source)
        working-directory: apps/api
        run: uvx bandit --recursive orbit_api --severity-level medium --confidence-level medium --quiet
      - name: pnpm audit (web, desktop, shared packages)
        run: pnpm audit --audit-level high

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
