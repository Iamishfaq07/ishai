name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Build the Windows app as this version (e.g. 0.1.1) — for update testing / releases"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: orbit, POSTGRES_PASSWORD: orbit, POSTGRES_DB: orbit }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy orbit_api
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Migrations on Postgres + pgvector
        env: { ORBIT_DATABASE_URL: "postgresql+asyncpg://orbit:orbit@localhost:5432/orbit" }
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4  # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm --filter @orbit/web build

  # Windows-first (macOS deferred). Builds a runnable orbit-desktop.exe + NSIS installer artifact.
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      # tauri::generate_context! embeds frontendDist at compile time, so build the frontend first
      - run: pnpm --filter @orbit/desktop build
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: tauri build (release exe + NSIS installer + updater signature)
        shell: bash
        env:
          # minisign key for updater signatures (not Authenticode code signing)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          overrides=()
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            [[ "$VERSION_OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION_OVERRIDE"; exit 1; }
            overrides+=("\"version\":\"$VERSION_OVERRIDE\"")
          fi
          # Dependabot and fork PRs don't get repo secrets: still prove the app builds, just without the
          # updater .sig (which needs the key) instead of failing the job.
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::notice::No updater signing key available; building without updater artifacts"
            overrides+=("\"bundle\":{\"createUpdaterArtifacts\":false}")
          fi
          if (( ${#overrides[@]} )); then
            config="{$(IFS=,; echo "${overrides[*]}")}"
            pnpm --filter @orbit/desktop tauri build --bundles nsis --config "$config"
          else
            pnpm --filter @orbit/desktop tauri build --bundles nsis
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/release/orbit-desktop.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (deploy artifact)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
