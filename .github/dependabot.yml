version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
    ignore:
      # Tailwind 4 is a migration (CSS-first config, @tailwindcss/postcss), not a bump: do it as its own change.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # Node's types follow the Node version CI and the desktop build run on (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: weekly }
    groups:
      # `windows` and `windows-core` must move in lockstep: the #[implement] macro from one expands to the other.
      windows-crates: { patterns: ["windows", "windows-*"] }
      cargo-minor: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
    ignore:
      # A new Python minor is a migration (CI, mypy target and lockfile move with it), not a base-image bump: 3.14
      # shipped with a pydantic that can't import on it. Digest and patch updates still come through.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
