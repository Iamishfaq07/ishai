name: orbit

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ../apps/api
    env_file: ../apps/api/.env
    environment:
      ORBIT_DATABASE_URL: postgresql+asyncpg://orbit:orbit@postgres:5432/orbit
      ORBIT_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: [full]

volumes:
  pgdata:
