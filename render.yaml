# Render Blueprint for the Orbit API (free tier, no credit card required).
# Deploy: Render dashboard → New → Blueprint → pick this repo.
# The web app is hosted separately on Cloudflare Pages; the DB is Neon (set ORBIT_DATABASE_URL below).
services:
  - type: web
    name: orbit-api
    runtime: docker
    plan: free
    region: ohio # closest to a us-east-2 Neon database; change if your Neon region differs
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /ready
    # Exactly one instance: live-session state (WS tickets, socket ownership, rate limits) is in process memory.
    # Scaling out before that state moves to Redis would break live sessions (docs/DECISIONS.md D12).
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: ORBIT_ENV
        value: production
      # Secrets — set these in the Render dashboard (sync:false = prompted, never stored in git):
      - key: ORBIT_DATABASE_URL # Neon string as postgresql+asyncpg://... (direct endpoint, no -pooler)
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ORBIT_ADMIN_EMAIL # the account allowed to edit Advanced settings
        sync: false
      - key: ORBIT_WEB_URL # your Cloudflare Pages URL, e.g. https://orbit-web.pages.dev
        sync: false
      - key: ORBIT_CORS_ORIGINS # JSON array or comma-separated: the Pages URL + tauri origins
        sync: false
      # This service's own https URL (e.g. https://orbit-api-5kcx.onrender.com): links it hands out (desktop
      # installer downloads) are built from it, never from the request's Host header.
      - key: ORBIT_API_PUBLIC_URL
        sync: false
      # 32+ random chars, the same value as the web Worker's secret (`wrangler secret put PROXY_SECRET`): only
      # the Worker may then state a caller's IP; per-IP rate limits can't be dodged by faking X-Forwarded-For.
      - key: ORBIT_PROXY_SECRET
        sync: false
      # UPI payments for Resume Pro (billing/upi.py): the UPI ID payers pay to and the name their app shows. Not
      # secret: every payer sees both.
      - key: ORBIT_UPI_ID
        value: octane7@ibl
      - key: ORBIT_UPI_NAME
        value: Ishfaq Ahmad Bhat
      # Desktop auto-update from GitHub Releases (Render free has no disk for ORBIT_DESKTOP_UPDATES_DIR).
      - key: ORBIT_UPDATES_GITHUB_REPO
        value: Iamishfaq07/ishai
      - key: ORBIT_UPDATES_GITHUB_TOKEN # fine-grained PAT: this repo only, Contents → Read-only
        sync: false
      # Generated once by Render and kept stable across deploys:
      - key: ORBIT_JWT_SECRET
        generateValue: true
      - key: ORBIT_CONFIG_SECRET
        generateValue: true
