# Render Blueprint for the Orbit API (free tier, no credit card required).
# Deploy: Render dashboard → New → Blueprint → pick this repo.
# The live service (orbit-api-sg, Singapore) was created with these settings through Render's API; the old Ohio
# Blueprint is paused with auto-sync off. Don't sync it: a Blueprint-made service gets NEW generated secrets
# (ORBIT_JWT_SECRET signs everyone out; ORBIT_CONFIG_SECRET can't read saved settings) unless you copy the old ones.
# The web app is hosted separately on Cloudflare Pages; the DB is Neon (set ORBIT_DATABASE_URL below).
services:
  - type: web
    name: orbit-api-sg
    runtime: docker
    plan: free
    # Next to the Neon database (aws-ap-southeast-1) and ~90 ms from India. Render can't move a service between
    # regions: a new region means a new service (and a new URL for the clients).
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /ready
    # Exactly one instance: live-session state (WS tickets, socket ownership, rate limits) is in process memory.
    # Scaling out before that state moves to Redis would break live sessions (docs/DECISIONS.md D12).
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: ORBIT_ENV
        value: production
      # Secrets — set these in the Render dashboard (sync:false = prompted, never stored in git):
      - key: ORBIT_DATABASE_URL # Neon string as postgresql+asyncpg://... (direct endpoint, no -pooler)
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ORBIT_ADMIN_EMAIL # the account allowed to edit Advanced settings
        sync: false
      - key: ORBIT_WEB_URL # your Cloudflare Pages URL, e.g. https://orbit-web.pages.dev
        sync: false
      - key: ORBIT_CORS_ORIGINS # JSON array or comma-separated: the Pages URL + tauri origins
        sync: false
      # This service's own https URL (e.g. https://orbit-api-sg.onrender.com): links it hands out (desktop
      # installer downloads) are built from it, never from the request's Host header.
      - key: ORBIT_API_PUBLIC_URL
        sync: false
      # 32+ random chars, the same value as the web Worker's secret (`wrangler secret put PROXY_SECRET`): only
      # the Worker may then state a caller's IP; per-IP rate limits can't be dodged by faking X-Forwarded-For.
      - key: ORBIT_PROXY_SECRET
        sync: false
      # Razorpay (billing/razorpay.py): with the key id and secret set, packs are bought through Razorpay's checkout
      # (cards from any country once Razorpay enables international payments, UPI, netbanking, wallets) and credited
      # automatically. Set them in the Render dashboard; the webhook secret is the one entered for the webhook at
      # Razorpay (URL: https://<api>/v1/billing/webhook, events payment.captured and order.paid).
      - key: ORBIT_RAZORPAY_KEY_ID
        sync: false
      - key: ORBIT_RAZORPAY_KEY_SECRET
        sync: false
      - key: ORBIT_RAZORPAY_WEBHOOK_SECRET
        sync: false
      # "true" once Razorpay has enabled international payments for the account: the pages then tell buyers abroad
      # their card works. Until then they say cards from other countries are coming soon.
      - key: ORBIT_RAZORPAY_INTERNATIONAL
        value: "false"
      # UPI payments (billing/upi.py), used while Razorpay isn't set up: the UPI ID payers pay to and the name their
      # app shows. Not secret: every payer sees both.
      - key: ORBIT_UPI_ID
        value: octane7@ibl
      - key: ORBIT_UPI_NAME
        value: Ishfaq Ahmad Bhat
      # Desktop auto-update from GitHub Releases (Render free has no disk for ORBIT_DESKTOP_UPDATES_DIR).
      - key: ORBIT_UPDATES_GITHUB_REPO
        value: Iamishfaq07/ishai
      - key: ORBIT_UPDATES_GITHUB_TOKEN # fine-grained PAT: this repo only, Contents → Read-only
        sync: false
      # Generated once by Render and kept stable across deploys:
      - key: ORBIT_JWT_SECRET
        generateValue: true
      - key: ORBIT_CONFIG_SECRET
        generateValue: true
