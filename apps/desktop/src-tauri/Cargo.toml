[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Orbit — real-time interview and meeting copilot"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
cpal = "0.18"
png = "0.17"
xcap = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
# Per-app audio capture (WASAPI process loopback). Same version Tauri already pulls in.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.61" # the #[implement] macro expands to ::windows_core

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
