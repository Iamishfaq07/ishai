<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The link preview (WhatsApp, LinkedIn, X): the source of public/og-image.png. Rendered to a 1200 x 630 PNG in
       headless Chrome with Space Grotesk and Inter loaded, then palette-quantized with dithering so it stays under
       100 KB (tools/orbit-drive/og-render.mjs and og-quantize.py on the owner's machine). Change this file, then
       render it again. -->
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#4f3bd6" stop-opacity="0.55" />
      <stop offset="1" stop-color="#0b0c1f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7048F5" /><stop offset=".5" stop-color="#A48BFA" /><stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD" /><stop offset="1" stop-color="#7048F5" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0c1f" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Wordmark -->
  <g transform="translate(72 64) scale(0.75)">
    <path d="M51.41 20.84 A23 23 0 1 1 43.16 12.59" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" />
    <circle cx="32" cy="32" r="9" fill="url(#core)" />
    <path d="M48.26 6.76 L50.34 13.66 L57.24 15.74 L50.34 17.82 L48.26 24.72 L46.18 17.82 L39.28 15.74 L46.18 13.66Z" fill="#fff" />
  </g>
  <text x="132" y="101" font-family="Space Grotesk Variable, Space Grotesk, sans-serif" font-weight="600" font-size="38" fill="#ffffff" letter-spacing="-0.5">orbit</text>

  <!-- Headline -->
  <g font-family="Space Grotesk Variable, Space Grotesk, sans-serif" font-weight="600" font-size="66" fill="#ffffff" letter-spacing="-1.5">
    <text x="72" y="240">Practise interviews.</text>
    <text x="72" y="320">Fix your resume.</text>
    <text x="72" y="400">Find jobs.</text>
  </g>
  <text x="72" y="462" font-family="Inter Variable, Inter, sans-serif" font-size="27" fill="#c7c9e4">One free account. Pay with UPI, no subscription.</text>

  <!-- The three products -->
  <g font-family="Inter Variable, Inter, sans-serif" font-size="22" font-weight="600">
    <rect x="72" y="514" width="186" height="48" rx="24" fill="#6d5df6" fill-opacity="0.18" stroke="#a5b4fc" stroke-opacity="0.45" />
    <circle cx="98" cy="538" r="7" fill="#a5b4fc" />
    <text x="116" y="546" fill="#dfe1ff">Interview</text>
    <rect x="274" y="514" width="196" height="48" rx="24" fill="#10b981" fill-opacity="0.16" stroke="#6ee7b7" stroke-opacity="0.45" />
    <circle cx="300" cy="538" r="7" fill="#6ee7b7" />
    <text x="318" y="546" fill="#d1fae5">Resume AI</text>
    <rect x="486" y="514" width="168" height="48" rx="24" fill="#0ea5e9" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.45" />
    <circle cx="512" cy="538" r="7" fill="#7dd3fc" />
    <text x="530" y="546" fill="#e0f2fe">Jobs AI</text>
  </g>

  <!-- A live answer card -->
  <g transform="translate(748 150)">
    <rect width="384" height="330" rx="28" fill="#15162e" stroke="#ffffff" stroke-opacity="0.12" />
    <circle cx="34" cy="38" r="7" fill="#f43f5e" />
    <text x="52" y="45" font-family="Inter Variable, Inter, sans-serif" font-size="19" font-weight="600" fill="#e4e4f0">Live interview</text>
    <g fill="#a5b4fc">
      <rect x="316" y="30" width="4" height="16" rx="2" /><rect x="326" y="24" width="4" height="22" rx="2" />
      <rect x="336" y="32" width="4" height="14" rx="2" /><rect x="346" y="26" width="4" height="20" rx="2" />
    </g>
    <line x1="0" y1="72" x2="384" y2="72" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="28" y="108" font-family="Inter Variable, Inter, sans-serif" font-size="16" fill="#9a9cbd">Interviewer</text>
    <g font-family="Space Grotesk Variable, Space Grotesk, sans-serif" font-size="23" font-weight="500" fill="#ffffff">
      <text x="28" y="140">“Tell me about a project</text>
      <text x="28" y="170">you're proud of.”</text>
    </g>
    <rect x="20" y="196" width="344" height="112" rx="18" fill="#6d5df6" fill-opacity="0.14" stroke="#a5b4fc" stroke-opacity="0.3" />
    <text x="40" y="226" font-family="Inter Variable, Inter, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">Suggested answer, from your resume</text>
    <g fill="#e4e4f0" fill-opacity="0.82">
      <rect x="40" y="244" width="300" height="10" rx="5" />
      <rect x="40" y="264" width="262" height="10" rx="5" />
      <rect x="40" y="284" width="190" height="10" rx="5" />
    </g>
  </g>
</svg>
