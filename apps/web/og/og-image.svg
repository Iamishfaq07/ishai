<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The link preview (WhatsApp, LinkedIn, X): the source of public/og-image.jpg, also served as public/og-image.svg.
       Crawlers only take raster previews, so render it to a 1200 x 630 JPEG (quality 90) in headless Chrome with Space
       Grotesk and Inter loaded; keep it under 300 KB (WhatsApp skips bigger ones). Change this file, copy it to
       public/, then render it again.
       Deep Space: #04060C, a cyan and an indigo glow, a dot grid fading out; text #F8FAFC / #94A3B8 (AA and better). -->
  <defs>
    <radialGradient id="cyan" cx="0.86" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigo" cx="0.12" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.34" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#ffffff" fill-opacity="0.16" />
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="dotmask"><rect width="1200" height="630" fill="url(#fade)" /></mask>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" /><stop offset=".5" stop-color="#a5b4fc" /><stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe" /><stop offset="1" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="0.45" stop-color="#0b101e" stop-opacity="0.85" />
      <stop offset="1" stop-color="#050811" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.42" />
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#04060c" />
  <rect width="1200" height="630" fill="url(#cyan)" />
  <rect width="1200" height="630" fill="url(#indigo)" />
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#dotmask)" />

  <!-- Wordmark and address -->
  <g transform="translate(72 60) scale(0.75)">
    <path d="M51.41 20.84 A23 23 0 1 1 43.16 12.59" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" />
    <circle cx="32" cy="32" r="9" fill="url(#core)" />
    <path d="M48.26 6.76 L50.34 13.66 L57.24 15.74 L50.34 17.82 L48.26 24.72 L46.18 17.82 L39.28 15.74 L46.18 13.66Z" fill="#fff" />
  </g>
  <text x="132" y="97" font-family="Space Grotesk Variable, Space Grotesk, sans-serif" font-weight="600" font-size="38" fill="#f8fafc" letter-spacing="-0.5">Orbit</text>
  <text x="240" y="97" font-family="Inter Variable, Inter, sans-serif" font-size="26" fill="#94a3b8">orbitanswer.com</text>

  <!-- Headline -->
  <g font-family="Space Grotesk Variable, Space Grotesk, sans-serif" font-weight="600" font-size="64" fill="#f8fafc" letter-spacing="-1.5">
    <text x="72" y="236">Your career co-pilot,</text>
    <text x="72" y="314">from job hunt to offer.</text>
  </g>
  <text x="72" y="376" font-family="Inter Variable, Inter, sans-serif" font-size="27" fill="#94a3b8">One free account. No subscription.</text>

  <!-- The four products -->
  <g font-family="Inter Variable, Inter, sans-serif" font-size="22" font-weight="600">
    <rect x="72" y="430" width="158" height="50" rx="25" fill="#0ea5e9" fill-opacity="0.14" stroke="#7dd3fc" stroke-opacity="0.5" />
    <circle cx="98" cy="455" r="7" fill="#7dd3fc" />
    <text x="116" y="463" fill="#e0f2fe">Jobs AI</text>

    <rect x="246" y="430" width="186" height="50" rx="25" fill="#10b981" fill-opacity="0.14" stroke="#6ee7b7" stroke-opacity="0.5" />
    <circle cx="272" cy="455" r="7" fill="#6ee7b7" />
    <text x="290" y="463" fill="#d1fae5">Resume AI</text>

    <rect x="448" y="430" width="160" height="50" rx="25" fill="#6366f1" fill-opacity="0.16" stroke="#a5b4fc" stroke-opacity="0.5" />
    <circle cx="474" cy="455" r="7" fill="#a5b4fc" />
    <text x="492" y="463" fill="#e0e7ff">Practice</text>

    <rect x="72" y="496" width="270" height="50" rx="25" fill="#22d3ee" fill-opacity="0.12" stroke="#67e8f9" stroke-opacity="0.5" />
    <circle cx="98" cy="521" r="7" fill="#67e8f9" />
    <text x="116" y="529" fill="#cffafe">Live Coding Co-Pilot</text>
  </g>

  <!-- A live answer card, glass with a lit top edge -->
  <g transform="translate(748 140)">
    <rect width="384" height="340" rx="28" fill="url(#card)" />
    <rect x="0.75" y="0.75" width="382.5" height="338.5" rx="27.25" fill="none" stroke="url(#edge)" stroke-width="1.5" />
    <circle cx="34" cy="38" r="7" fill="#34d399" />
    <circle cx="34" cy="38" r="12" fill="none" stroke="#34d399" stroke-opacity="0.4" stroke-width="2" />
    <text x="54" y="45" font-family="Inter Variable, Inter, sans-serif" font-size="19" font-weight="600" fill="#f8fafc">Live interview</text>
    <g fill="#67e8f9">
      <rect x="316" y="30" width="4" height="16" rx="2" /><rect x="326" y="24" width="4" height="22" rx="2" />
      <rect x="336" y="32" width="4" height="14" rx="2" /><rect x="346" y="26" width="4" height="20" rx="2" />
    </g>
    <line x1="0" y1="72" x2="384" y2="72" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="28" y="108" font-family="Inter Variable, Inter, sans-serif" font-size="16" fill="#94a3b8">Interviewer</text>
    <g font-family="Space Grotesk Variable, Space Grotesk, sans-serif" font-size="23" font-weight="500" fill="#f8fafc">
      <text x="28" y="140">“Walk me through how you'd</text>
      <text x="28" y="170">design a rate limiter.”</text>
    </g>
    <rect x="20" y="196" width="344" height="120" rx="18" fill="#6366f1" fill-opacity="0.14" stroke="#a5b4fc" stroke-opacity="0.32" />
    <text x="40" y="226" font-family="Inter Variable, Inter, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">Suggested answer, from your resume</text>
    <g fill="#e2e8f0" fill-opacity="0.85">
      <rect x="40" y="246" width="300" height="10" rx="5" />
      <rect x="40" y="266" width="262" height="10" rx="5" />
      <rect x="40" y="286" width="190" height="10" rx="5" />
    </g>
  </g>
</svg>
