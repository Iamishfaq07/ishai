name: orbit-search
services:
  searxng:
    image: docker.io/searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    restart: unless-stopped
    # Only the API on this host can reach this port. Use private service DNS when hosting separately.
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      FORCE_OWNERSHIP: "false"
      SEARXNG_SECRET: ${ORBIT_SEARCH_SERVICE_SECRET:?Set a locally generated signing secret; no vendor API key required}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - search-data:/var/cache/searxng
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
volumes:
  search-data:
